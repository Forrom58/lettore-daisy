<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test iOS Audio e Voce</title>
    <style>
        body { background-color: #111; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        button { background-color: #fbbf24; color: #000; border: none; border-radius: 20px; width: 100%; height: 200px; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        #log { background: #222; padding: 15px; border-radius: 10px; text-align: left; font-family: monospace; min-height: 150px; }
        .successo { color: #4ade80; }
        .errore { color: #f87171; }
    </style>
</head>
<body>

    <h2>Test Sblocco iOS</h2>
    
    <!-- Audio di test (un semplice beep) -->
    <audio id="testPlayer" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

    <button id="btnTest">1. TOCCA PER INIZIARE</button>

    <div id="log">In attesa di test...<br></div>

    <script>
        const btnTest = document.getElementById('btnTest');
        const log = document.getElementById('log');
        const player = document.getElementById('testPlayer');
        let audioSbloccato = false;

        function scriviLog(testo, classe = "") {
            log.innerHTML += `<span class="${classe}">${testo}</span><br>`;
        }

        // FASE 1: Tocco per sbloccare l'audio
        btnTest.addEventListener('click', () => {
            if (!audioSbloccato) {
                scriviLog("Tento lo sblocco dell'audio...");
                // Avvio e metto subito in pausa per sbloccare il motore audio
                player.play().then(() => {
                    player.pause();
                    audioSbloccato = true;
                    scriviLog("✅ Audio sbloccato correttamente dal tocco.", "successo");
                    btnTest.textContent = "2. TOCCA E PARLA";
                }).catch(err => {
                    scriviLog("❌ Errore sblocco: " + err, "errore");
                });
            } else {
                avviaMicrofono();
            }
        });

        // FASE 2: Avvio riconoscimento vocale
        function avviaMicrofono() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                scriviLog("❌ Il browser iOS non supporta SpeechRecognition.", "errore");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            
            recognition.onstart = () => {
                btnTest.style.backgroundColor = "#f87171";
                btnTest.textContent = "IN ASCOLTO (dì 'suona')";
                scriviLog("🎤 Microfono aperto...");
            };

            recognition.onend = () => {
                btnTest.style.backgroundColor = "#fbbf24";
                btnTest.textContent = "TOCCA E PARLA";
            };

            recognition.onresult = (e) => {
                const comando = e.results[0][0].transcript.toLowerCase();
                scriviLog("🗣️ Hai detto: " + comando);
                
                if (comando.includes('suona') || comando.includes('leggi') || comando.includes('play')) {
                    scriviLog("⏳ Provo ad avviare l'audio...");
                    
                    // FASE 3: Tento di suonare a partire da un comando vocale (Punto critico iOS)
                    player.play().then(() => {
                        scriviLog("🎵 SUCCESS! L'audio suona da comando vocale.", "successo");
                    }).catch(err => {
                        scriviLog("🚫 BLOCCO APPLE: L'audio è stato bloccato. " + err, "errore");
                    });
                }
            };

            recognition.start();
        }
    </script>
</body>
</html>
