<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Vocale</title>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; font-family: sans-serif; 
            background-color: #222; color: white; margin: 0; 
        }
        button { 
            width: 200px; height: 200px; font-size: 24px; border-radius: 50%; 
            background-color: #007bff; color: white; border: none; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        button:active { background-color: #0056b3; }
        #risultato { margin-top: 40px; font-size: 22px; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <button id="btnParla">Parla</button>
    <div id="risultato">Il testo apparirà qui...</div>

    <script>
        const btnParla = document.getElementById('btnParla');
        const divRisultato = document.getElementById('risultato');

        let velocitaAttuale = 1.0;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            divRisultato.innerText = "Errore: Browser non compatibile.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            btnParla.addEventListener('click', () => {
                divRisultato.innerText = "In ascolto...";
                recognition.start();
            });

            recognition.addEventListener('result', (e) => {
                let comando = e.results[0][0].transcript.toLowerCase();
                comando = comando.replace(/[.,!?]/g, '').trim();
                divRisultato.innerText = "Hai detto: " + comando;

                if (comando.includes('leggi')) {
                    alert("Azione: Leggi");
                } else if (comando.includes('stop')) {
                    alert("Azione: Stop");
                } else if (comando.includes('avanti un capitolo') || comando.includes('capitolo successivo')) {
                    alert("Azione: Avanti un capitolo");
                } else if (comando.includes('indietro un capitolo') || comando.includes('capitolo precedente')) {
                    alert("Azione: Indietro un capitolo");
                } else if (comando.includes('avanti') && (comando.includes('30') || comando.includes('trenta'))) {
                    alert("Azione: Avanti 30 secondi");
                } else if (comando.includes('indietro') && (comando.includes('15') || comando.includes('quindici'))) {
                    alert("Azione: Indietro 15 secondi");
                } else if (comando.includes('segnalibro')) {
                    alert("Azione: Aggiungi segnalibro");
                } else if (comando.includes('più veloce') || comando.includes('piu veloce')) { 
                    velocitaAttuale += 0.25;
                    if (velocitaAttuale > 2.0) velocitaAttuale = 2.0;
                    alert("Azione: Velocità aumentata a " + velocitaAttuale);
                } else if (comando.includes('più lento') || comando.includes('piu lento')) { 
                    velocitaAttuale -= 0.25;
                    if (velocitaAttuale < 0.75) velocitaAttuale = 0.75;
                    alert("Azione: Velocità diminuita a " + velocitaAttuale);
                } else {
                    alert("Comando non riconosciuto. Il telefono ha capito: [" + comando + "]");
                }
            });

            recognition.addEventListener('error', (e) => {
                divRisultato.innerText = "Errore: " + e.error;
            });
        }
    </script>
</body>
</html>
