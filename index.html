    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <script>
        const fileInput = document.getElementById('daisyFileInput');
        const uploadLabel = document.getElementById('uploadLabel');
        const uiBookTitle = document.getElementById('bookTitle');
        const uiChapterTitle = document.getElementById('chapterTitle');
        const uiTotalChapters = document.getElementById('totalChapters');
        const uiCurrentChapter = document.getElementById('currentChapter');
        const playBtn = document.getElementById('playBtn');
        const playSvg = document.getElementById('playSvg');
        const playIconPath = document.getElementById('playIconPath');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const skipBackBtn = document.getElementById('skipBackBtn');
        const skipForwardBtn = document.getElementById('skipForwardBtn');
        const speedBtn = document.getElementById('speedBtn');
        const audioPlayer = document.getElementById('audioPlayer');
        
        const chapterTimeCurrent = document.getElementById('chapterTimeCurrent');
        const chapterTimeTotal = document.getElementById('chapterTimeTotal');
        const chapterProgressBar = document.getElementById('chapterProgressBar');
        const chapterProgressContainer = document.getElementById('chapterProgressContainer');
        const bookTimeCurrent = document.getElementById('bookTimeCurrent');
        const bookTimeTotal = document.getElementById('bookTimeTotal');
        const bookProgressBar = document.getElementById('bookProgressBar');
        
        const addBookmarkBtn = document.getElementById('addBookmarkBtn');
        const bookmarksList = document.getElementById('bookmarksList');
        
        let loadedZip = null;
        let chaptersList = [];
        let isPlaying = false;
        let currentChapterIndex = 0;
        
        let currentChapterAudioList = []; 
        let currentSnippetIndex = 0;
        let chapterTotalSeconds = 0;
        let bookTotalSeconds = 0;
        let pendingSeekTime = 0; 
        
        const playbackSpeeds = [1.0, 1.25, 1.5, 2.0, 0.75];
        let currentSpeedIndex = 0;
        
        let bookmarks = [];

        const svgPathPlay = "M8 5v14l11-7z";
        const svgPathPause = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

        function updatePlayIcon() {
            if (isPlaying) {
                playIconPath.setAttribute('d', svgPathPause);
                playSvg.classList.remove('-translate-x-[1px]');
            } else {
                playIconPath.setAttribute('d', svgPathPlay);
                playSvg.classList.add('-translate-x-[1px]');
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "0:00";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) {
                return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function parseSmilTime(timeStr) {
            if (!timeStr) return 0;
            let s = timeStr.toLowerCase().replace('npt=', '').replace('s', '').trim();
            if (s.includes(':')) {
                let parts = s.split(':');
                if (parts.length === 3) return parseInt(parts[0])*3600 + parseInt(parts[1])*60 + parseFloat(parts[2]);
                if (parts.length === 2) return parseInt(parts[0])*60 + parseFloat(parts[1]);
            }
            return parseFloat(s) || 0;
        }

        function loadBookmarks() {
            if(!uiBookTitle.textContent) return;
            const saved = localStorage.getItem('daisy_bookmarks_' + uiBookTitle.textContent);
            bookmarks = saved ? JSON.parse(saved) : [];
            renderBookmarks();
        }

        function saveBookmarks() {
            localStorage.setItem('daisy_bookmarks_' + uiBookTitle.textContent, JSON.stringify(bookmarks));
            renderBookmarks();
        }

        function renderBookmarks() {
            bookmarksList.innerHTML = '';
            bookmarks.forEach((bm, index) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-[#233040] p-3 rounded-lg border border-gray-700";
                div.innerHTML = `
                    <div class="flex-1 cursor-pointer hover:text-yellow-brand truncate pr-2" onclick="goToBookmark(${index})">
                        <p class="text-xs text-gray-400">Capitolo ${bm.chapterIndex + 1} - ${bm.displayTime}</p>
                        <p class="text-sm font-bold truncate">${bm.chapterTitle}</p>
                    </div>
                    <button onclick="deleteBookmark(${index})" class="text-gray-500 hover:text-salmon-brand p-2 bg-[#000000] rounded-md transition-colors">🗑️</button>
                `;
                bookmarksList.appendChild(div);
            });
        }

        function saveLastPosition() {
            if (!uiBookTitle.textContent || chaptersList.length === 0) return;
            if (currentChapterAudioList.length === 0 || !currentChapterAudioList[currentSnippetIndex]) return;
            
            const absoluteCurrentTime = currentChapterAudioList[currentSnippetIndex].startOffset + audioPlayer.currentTime;
            const state = {
                chapterIndex: currentChapterIndex,
                time: absoluteCurrentTime
            };
            localStorage.setItem('daisy_progress_' + uiBookTitle.textContent, JSON.stringify(state));
        }

        function getLastPosition() {
            if (!uiBookTitle.textContent) return null;
            const saved = localStorage.getItem('daisy_progress_' + uiBookTitle.textContent);
            return saved ? JSON.parse(saved) : null;
        }

        function askResume(chapterText, timeText) {
            return new Promise((resolve) => {
                const modal = document.getElementById('resumeModal');
                const modalText = document.getElementById('resumeModalText');
                const btnYes = document.getElementById('resumeModalYes');
                const btnNo = document.getElementById('resumeModalNo');

                modalText.textContent = `Trovato un ascolto precedente per questo libro.\nVuoi riprendere dal Capitolo ${chapterText} (${timeText})?`;
                modal.classList.remove('hidden');

                const handleYes = () => {
                    modal.classList.add('hidden');
                    cleanup();
                    resolve(true);
                };

                const handleNo = () => {
                    modal.classList.add('hidden');
                    cleanup();
                    resolve(false);
                };

                const cleanup = () => {
                    btnYes.removeEventListener('click', handleYes);
                    btnNo.removeEventListener('click', handleNo);
                };

                btnYes.addEventListener('click', handleYes);
                btnNo.addEventListener('click', handleNo);
            });
        }

        addBookmarkBtn.addEventListener('click', () => {
            if (currentChapterAudioList.length === 0) return;
            let absoluteCurrentTime = currentChapterAudioList[currentSnippetIndex].startOffset + audioPlayer.currentTime;
            bookmarks.push({
                chapterIndex: currentChapterIndex,
                chapterTitle: chaptersList[currentChapterIndex].title,
                time: absoluteCurrentTime,
                displayTime: formatTime(absoluteCurrentTime)
            });
            saveBookmarks();
        });

        window.goToBookmark = async function(index) {
            const bm = bookmarks[index];
            if (bm.chapterIndex !== currentChapterIndex) {
                await playChapter(bm.chapterIndex, true, bm.time);
            } else {
                seekToTime(bm.time);
                if (!isPlaying) {
                    audioPlayer.play();
                    isPlaying = true;
                    updatePlayIcon();
                }
            }
        }

        window.deleteBookmark = function(index) {
            bookmarks.splice(index, 1);
            saveBookmarks();
        }

        fileInput.addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            uiBookTitle.textContent = "Caricamento in corso...";
            chaptersList = [];
            bookTotalSeconds = 0;
            bookmarksList.innerHTML = '';

            if (file.name.toLowerCase().endsWith('.zip')) {
                try {
                    loadedZip = new JSZip();
                    const zipContent = await loadedZip.loadAsync(file);
                    
                    let nccFile = null;
                    zipContent.forEach(function (relativePath, zipEntry) {
                        if (relativePath.toLowerCase().endsWith('ncc.html') || relativePath.toLowerCase().endsWith('ncc.htm')) {
                            nccFile = zipEntry;
                        }
                    });

                    if (nccFile) {
                        const nccText = await nccFile.async("string");
                        const parser = new DOMParser();
                        const htmlDoc = parser.parseFromString(nccText, "text/html");
                        
                        const titleTag = htmlDoc.querySelector("title") || htmlDoc.querySelector("meta[name='dc:title']");
                        if (titleTag) {
                            uiBookTitle.textContent = titleTag.tagName.toLowerCase() === 'meta' ? titleTag.getAttribute('content') : titleTag.textContent;
                            loadBookmarks();
                        }

                        const totalTimeMeta = htmlDoc.querySelector("meta[name='ncc:totalTime']");
                        if (totalTimeMeta) {
                            bookTotalSeconds = parseSmilTime(totalTimeMeta.getAttribute('content'));
                            bookTimeTotal.textContent = formatTime(bookTotalSeconds);
                        } else {
                            bookTimeTotal.textContent = "N/D";
                        }

                        const allLinks = Array.from(htmlDoc.querySelectorAll("a"));
                        const smilLinks = allLinks.filter(link => {
                            const href = link.getAttribute('href');
                            return href && href.toLowerCase().includes('.smil');
                        });

                        smilLinks.forEach(link => {
                            chaptersList.push({
                                title: link.textContent.trim() || "Capitolo senza titolo",
                                smilTarget: link.getAttribute('href').split('#')[0]
                            });
                        });

                        uiTotalChapters.textContent = chaptersList.length;

                        if (chaptersList.length > 0) {
                            uploadLabel.classList.add('hidden');

                            const lastState = getLastPosition();
                            let startChapter = 0;
                            let startTime = 0;

                            if (lastState && lastState.time > 0) {
                                const minuttiFormattati = formatTime(lastState.time);
                                const wantsToResume = await askResume(lastState.chapterIndex + 1, minuttiFormattati);
                                if (wantsToResume) {
                                    startChapter = lastState.chapterIndex;
                                    startTime = lastState.time;
                                }
                            }

                            await playChapter(startChapter, false, startTime);
                        } else {
                            uiChapterTitle.textContent = "Nessun capitolo trovato";
                        }
                    } else {
                        uiBookTitle.textContent = "Formato 3.0 non ancora supportato";
                    }
                } catch (error) {
                    console.error("Errore:", error);
                    uiBookTitle.textContent = "Errore di caricamento";
                }
            }
        });

        async function loadChapterAudio(smilFileName, startTime = 0) {
            if (!loadedZip) return;
            
            try {
                const smilFile = Object.values(loadedZip.files).find(f => f.name.toLowerCase().endsWith(smilFileName.toLowerCase()));
                if (!smilFile) return;

                const smilText = await smilFile.async("string");
                const parser = new DOMParser();
                const smilDoc = parser.parseFromString(smilText, "text/xml");
                
                const audioNodes = Array.from(smilDoc.getElementsByTagName("audio"));
                currentChapterAudioList = [];
                chapterTotalSeconds = 0;

                audioNodes.forEach(node => {
                    let begin = parseSmilTime(node.getAttribute("clip-begin") || node.getAttribute("clipBegin"));
                    let end = parseSmilTime(node.getAttribute("clip-end") || node.getAttribute("clipEnd"));
                    let duration = end - begin;
                    if (duration < 0 || isNaN(duration)) duration = 0;
                    
                    currentChapterAudioList.push({
                        src: node.getAttribute("src"),
                        duration: duration,
                        startOffset: chapterTotalSeconds
                    });
                    chapterTotalSeconds += duration;
                });

                chapterTimeTotal.textContent = formatTime(chapterTotalSeconds);
                chapterProgressBar.style.width = "0%";
                
                if (startTime > 0) {
                    let startSnippet = 0;
                    for (let i = 0; i < currentChapterAudioList.length; i++) {
                        let snip = currentChapterAudioList[i];
                        if (startTime >= snip.startOffset && startTime < (snip.startOffset + snip.duration)) {
                            startSnippet = i;
                            break;
                        }
                    }
                    currentSnippetIndex = startSnippet;
                    pendingSeekTime = startTime - currentChapterAudioList[startSnippet].startOffset;
                } else {
                    currentSnippetIndex = 0;
                    pendingSeekTime = 0;
                }
                
                await prepareSnippet(currentSnippetIndex);
                
            } catch (e) {
                console.error("Errore nel caricamento del capitolo:", e);
            }
        }

        async function prepareSnippet(index) {
            if (index >= currentChapterAudioList.length) {
                if (currentChapterIndex < chaptersList.length - 1) {
                    playChapter(currentChapterIndex + 1, isPlaying);
                } else {
                    isPlaying = false;
                    updatePlayIcon();
                }
                return;
            }

            const snippet = currentChapterAudioList[index];
            const mp3File = Object.values(loadedZip.files).find(f => f.name.toLowerCase().endsWith(snippet.src.toLowerCase()));
            
            if (mp3File) {
                const mp3Blob = await mp3File.async("blob");
                const audioUrl = URL.createObjectURL(mp3Blob);
                
                audioPlayer.src = audioUrl;
                audioPlayer.playbackRate = playbackSpeeds[currentSpeedIndex];
                
                audioPlayer.onloadedmetadata = () => {
                    if (pendingSeekTime > 0) {
                        audioPlayer.currentTime = pendingSeekTime;
                        pendingSeekTime = 0;
                    }
                    if (isPlaying) {
                        audioPlayer.play();
                    }
                };
            } else {
                currentSnippetIndex++;
                prepareSnippet(currentSnippetIndex);
            }
        }

        audioPlayer.addEventListener('ended', () => {
            currentSnippetIndex++;
            prepareSnippet(currentSnippetIndex);
        });

        audioPlayer.addEventListener('timeupdate', () => {
            if (currentChapterAudioList.length === 0 || !currentChapterAudioList[currentSnippetIndex]) return;
            
            const currentSnippet = currentChapterAudioList[currentSnippetIndex];
            const currentChapterTime = currentSnippet.startOffset + audioPlayer.currentTime;
            
            chapterTimeCurrent.textContent = formatTime(currentChapterTime);
            
            if (chapterTotalSeconds > 0) {
                const chapterPercent = (currentChapterTime / chapterTotalSeconds) * 100;
                chapterProgressBar.style.width = Math.min(chapterPercent, 100) + "%";
            }

            if (bookTotalSeconds > 0 && chaptersList.length > 0) {
                const bookProgressPercent = ((currentChapterIndex + (currentChapterTime / chapterTotalSeconds)) / chaptersList.length) * 100;
                bookProgressBar.style.width = Math.min(bookProgressPercent, 100) + "%";
                const estimatedCurrentBookTime = (bookTotalSeconds / chaptersList.length) * (currentChapterIndex + (currentChapterTime / chapterTotalSeconds));
                bookTimeCurrent.textContent = formatTime(estimatedCurrentBookTime);
            }

            saveLastPosition();
        });

        async function playChapter(index, autoPlay = true, startTime = 0) {
            if (index < 0 || index >= chaptersList.length) return;
            
            currentChapterIndex = index;
            uiChapterTitle.textContent = chaptersList[index].title;
            uiCurrentChapter.textContent = currentChapterIndex + 1;
            
            audioPlayer.pause();
            isPlaying = autoPlay;
            updatePlayIcon();
            
            await loadChapterAudio(chaptersList[index].smilTarget, startTime);
        }

        function seekToTime(targetTime) {
            if (currentChapterAudioList.length === 0) return;
            
            if (targetTime < 0) targetTime = 0;
            if (targetTime > chapterTotalSeconds) targetTime = chapterTotalSeconds - 0.1;
            
            let newSnippetIndex = 0;
            for (let i = 0; i < currentChapterAudioList.length; i++) {
                let snip = currentChapterAudioList[i];
                if (targetTime >= snip.startOffset && targetTime < (snip.startOffset + snip.duration)) {
                    newSnippetIndex = i;
                    break;
                }
            }
            
            let targetTimeInSnippet = targetTime - currentChapterAudioList[newSnippetIndex].startOffset;
            
            if (newSnippetIndex === currentSnippetIndex) {
                audioPlayer.currentTime = targetTimeInSnippet;
            } else {
                currentSnippetIndex = newSnippetIndex;
                pendingSeekTime = targetTimeInSnippet;
                audioPlayer.pause(); 
                prepareSnippet(currentSnippetIndex);
            }
        }

        function jumpTime(secondsToAdd) {
            if (currentChapterAudioList.length === 0) return;
            let absoluteCurrentTime = currentChapterAudioList[currentSnippetIndex].startOffset + audioPlayer.currentTime;
            seekToTime(absoluteCurrentTime + secondsToAdd);
        }

        chapterProgressContainer.addEventListener('click', (e) => {
            if (currentChapterAudioList.length === 0 || chapterTotalSeconds === 0) return;
            
            const rect = chapterProgressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percentage = Math.max(0, Math.min(1, clickX / rect.width));
            
            const targetTime = percentage * chapterTotalSeconds;
            seekToTime(targetTime);
        });

        prevBtn.addEventListener('click', () => playChapter(currentChapterIndex - 1, isPlaying));
        nextBtn.addEventListener('click', () => playChapter(currentChapterIndex + 1, isPlaying));
        skipBackBtn.addEventListener('click', () => jumpTime(-15));
        skipForwardBtn.addEventListener('click', () => jumpTime(30));

        playBtn.addEventListener('click', () => {
            if (currentChapterAudioList.length === 0) return;
            
            if (isPlaying) {
                audioPlayer.pause();
            } else {
                audioPlayer.play();
            }
            isPlaying = !isPlaying;
            updatePlayIcon();
        });

        speedBtn.addEventListener('click', () => {
            currentSpeedIndex = (currentSpeedIndex + 1) % playbackSpeeds.length;
            const newSpeed = playbackSpeeds[currentSpeedIndex];
            audioPlayer.playbackRate = newSpeed;
            speedBtn.textContent = newSpeed.toFixed(2).replace('.', ',') + ' x';
        });

    </script>
    <script>
        // Registrazione Service Worker con Caching automatico
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'daisy-offline-v1';
                    
                    self.addEventListener('install', (e) => { self.skipWaiting(); });
                    self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
                    
                    self.addEventListener('fetch', (e) => {
                        // Ignora le richieste che non sono di caricamento (es. i file ZIP locali)
                        if (e.request.method !== 'GET') return;
                        
                        e.respondWith(
                            fetch(e.request).then((response) => {
                                // 1. Se c'è rete, scarica e mettine una copia in cache
                                const clone = response.clone();
                                caches.open(CACHE_NAME).then((cache) => {
                                    cache.put(e.request, clone);
                                });
                                return response;
                            }).catch(() => {
                                // 2. Se sei offline, recupera il file dalla cache
                                return caches.match(e.request).then((cached) => {
                                    return cached || caches.match('index.html') || caches.match('./');
                                });
                            })
                        );
                    });
                `;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(err => console.log('SW error:', err));
            });
        }
    </script>
